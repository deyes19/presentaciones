<header class="top"><div class="brand"><div class="brandmark">&lt;/&gt;</div><div><small>Clase interactiva</small><strong>Proyecto Web · CRUD</strong></div></div><div class="step-meta"><span class="phase-pill" id="phasePill">Introducción</span><span id="slideMeta">01 / 26</span></div><div class="toolbar"><button class="tbtn" id="outlineBtn" title="Índice (G)" aria-label="Abrir índice">☰</button><button class="tbtn" id="notesBtn" title="Notas docentes (N)" aria-label="Mostrar notas docentes">Notas</button><button class="tbtn" id="fontBtn" title="Texto más grande" aria-label="Aumentar tamaño del texto">Aa</button><button class="tbtn" id="fullBtn" title="Pantalla completa (F)" aria-label="Pantalla completa">⛶</button></div></header>

add(0,'De una página web a un sistema que guarda datos','CRUD · Node.js + Express · MySQL/MariaDB + XAMPP · API REST',()=>`<div class="hero-grid"><div><p class="eyebrow">Proyecto web · Taller práctico · 7:00–11:00 a. m.</p><h1 class="title">Construyamos un <span class="accent">inventario conectado</span>.</h1><p class="subtitle">Hoy no vamos a guardar productos solamente en una pantalla: los registraremos en una base de datos y los consultaremos mediante una API.</p><div class="hero-badges"><span class="chip green">● Node.js</span><span class="chip">Express</span><span class="chip">MySQL</span><span class="chip">XAMPP</span><span class="chip">fetch()</span></div><button class="primary" data-go="1">Comenzar la clase →</button></div><div class="hero-frame">${img(ASSETS.app,'Vista ilustrativa del inventario del proyecto','Vista ilustrativa del inventario que utilizaremos como referencia').replace('class="split-image"','class="split-image"')}</div></div>`, `<p><b>En voz alta:</b> “Hoy vamos a conectar una interfaz con una API y una base de datos. Al terminar, cada equipo demostrará que puede crear, consultar, editar y eliminar productos”.</p><p><b>Importante:</b> estás de reemplazo. Presenta una actividad autónoma, sin asumir un nivel previo. Inicia mostrando el resultado y luego explica sus partes.</p>`, '3 min','cover');
add(0,'La ruta de nuestra mañana','Una meta verificable para cada tramo.',()=>`<div class="columns ratio"><div class="tile glow"><div class="micro">Objetivo de hoy</div><div class="big-stat">4 operaciones</div><p>Al finalizar, cada equipo mostrará su CRUD conectado a MySQL y entregará un respaldo <b>.sql</b>.</p><div class="divider"></div><div class="tag-list"><span class="chip green">Crear</span><span class="chip">Leer</span><span class="chip amber">Actualizar</span><span class="chip">Eliminar</span></div></div><div class="tile"><div class="timeline"><span class="clock">7:00–7:20</span><span class="desc"><strong>Diagnóstico y recorrido</strong><small>Qué vamos a construir</small></span><span class="clock">7:20–8:00</span><span class="desc"><strong>XAMPP + MySQL</strong><small>Importar el archivo SQL</small></span><span class="clock">8:00–9:40</span><span class="desc"><strong>Node.js + API REST</strong><small>GET, POST, PUT y DELETE</small></span><span class="clock">9:40–10:05</span><span class="desc"><strong>Frontend + fetch()</strong><small>Comprobar las peticiones</small></span><span class="clock">10:05–10:30</span><span class="desc"><strong>Exportar e importar</strong><small>Respaldar datos</small></span><span class="clock">10:30–11:00</span><span class="desc"><strong>Reto + cierre</strong><small>Demostrar lo aprendido</small></span></div></div></div>`, `<p><b>Qué decir:</b> “No es una conferencia larga. Vamos a comprobar resultados durante cada etapa”.</p><p><b>Si el grupo avanza rápido:</b> pide agregar una categoría. <b>Si el grupo va lento:</b> prioriza conexión, GET y completar las cuatro operaciones usando el código base entregado.</p>`, '2 min');
add(0,'Primero: ¿qué tanto han trabajado?','Tres preguntas rápidas, sin examen ni calificación.',()=>`<div class="columns three"><div class="tile"><div class="bigicon">⌘</div><h3>JavaScript</h3><p>¿Han usado funciones asíncronas y <b>fetch()</b>?</p><span class="chip">Levanten la mano</span></div><div class="tile"><div class="bigicon">⬡</div><h3>Node.js</h3><p>¿Han ejecutado un proyecto con <b>npm start</b>?</p><span class="chip">Respuesta breve</span></div><div class="tile"><div class="bigicon">▤</div><h3>MySQL</h3><p>¿Han creado o importado tablas desde <b>phpMyAdmin</b>?</p><span class="chip">Muestra rápida</span></div></div><div class="nextline">${call('💡','La explicación será práctica. Si conocen el tema, avanzamos más rápido; si no, seguimos el mismo proyecto con una guía.')}</div>`, `<p><b>Haz estas tres preguntas</b> y adapta el ritmo, no el objetivo. Evita dar por sentado que dominan las APIs: el profesor titular no especificó su nivel exacto.</p><p><b>Decisión:</b> Si pocos dominan Node, usa el proyecto ya terminado como base y céntrate en entenderlo y probarlo.</p>`, '10 min');
add(0,'¿Qué sistema vamos a construir?','Una tienda escolar con cuatro acciones visibles.',()=>`<div class="columns revratio"><div class="tile">${img(ASSETS.app,'Diseño ilustrativo del inventario','Referencia visual de la aplicación. La interfaz real se abre en localhost:3000.')}</div><div class="tile glow"><div class="micro">Meta observable</div><h3>Inventario de productos</h3><p>Un formulario envía datos; una tabla muestra lo que está realmente almacenado.</p><div class="step-list" style="grid-template-columns:1fr 1fr;margin-top:19px"><div class="step-item"><b>+</b><small>Registrar</small></div><div class="step-item"><b>≡</b><small>Consultar</small></div><div class="step-item"><b>✎</b><small>Editar</small></div><div class="step-item"><b>×</b><small>Eliminar</small></div></div><div class="nextline"><a class="secondary" href="http://localhost:3000" target="_blank" rel="noopener">Abrir aplicación local ↗</a></div></div></div>`, `<p><b>Demostración:</b> abre <b>http://localhost:3000</b> con XAMPP y Node activos. Enseña primero el producto final para que los estudiantes tengan un referente.</p><p><b>Pregunta:</b> “Si recargamos la página, ¿por qué el producto sigue ahí?”. Lleva la conversación a la persistencia en MySQL.</p>`, '5 min');
add(0,'El recorrido de un dato','La idea más importante de toda la clase.',()=>`<div class="tile glow"><div class="micro">Haz clic en un componente para destacarlo</div><div class="flowline" id="flowline"><button class="flowbox ${flowStep===0?'active':''}" data-flow="0"><strong>🖥️ Navegador</strong><span>Formulario + fetch()</span></button><div class="arr">→</div><button class="flowbox ${flowStep===1?'active':''}" data-flow="1"><strong>⬡ Node.js</strong><span>Express · API REST</span></button><div class="arr">→</div><button class="flowbox ${flowStep===2?'active':''}" data-flow="2"><strong>▤ MySQL</strong><span>Tabla productos</span></button></div><div id="flowInfo" class="prompt">${['El usuario escribe los datos y JavaScript realiza una petición HTTP.','Express recibe la petición y ejecuta una consulta SQL a través de mysql2.','MySQL guarda o consulta los registros; Node responde en JSON y la interfaz se actualiza.'][flowStep]}</div></div><div class="columns three" style="margin-top:15px"><div class="tile"><h4>Frontend</h4><p>HTML, CSS y JavaScript</p></div><div class="tile"><h4>Backend</h4><p>Node.js, Express y rutas</p></div><div class="tile"><h4>Datos</h4><p>MySQL/MariaDB en XAMPP</p></div></div>`, `<p><b>Explica señalando:</b> “El navegador no habla directamente con MySQL. Habla con la API; la API es quien consulta o modifica la base”.</p><p><b>Dinámica:</b> pide a tres estudiantes representar navegador, servidor y base de datos. Simulen un registro nuevo y su respuesta.</p>`, '7 min');
add(0,'Las cuatro operaciones CRUD','Una acción visible, un método HTTP y una consulta SQL.',()=>`<div class="columns"><div class="tile"><div class="cards-2">${[['POST','Crear','INSERT'],['GET','Leer','SELECT'],['PUT','Actualizar','UPDATE'],['DELETE','Eliminar','DELETE']].map(([m,t,s])=>`<button class="cardbutton ${activeMethod===m?'active':''}" data-method="${m}"><span class="method ${m.toLowerCase()}">${m}</span><strong style="margin-top:9px">${t}</strong><small>SQL: ${s}</small></button>`).join('')}</div></div><div class="tile glow" id="methodInfo"><div class="micro">Método seleccionado</div><div class="big-stat">${activeMethod}</div><h3 style="margin-top:9px">${{GET:'Consultar productos',POST:'Registrar un producto',PUT:'Modificar un producto',DELETE:'Eliminar un producto'}[activeMethod]}</h3><p><code>${{GET:'/api/productos',POST:'/api/productos',PUT:'/api/productos/:id',DELETE:'/api/productos/:id'}[activeMethod]}</code></p><p>${{GET:'El navegador solicita información y recibe un arreglo JSON.',POST:'El cliente envía un producto y MySQL lo inserta.',PUT:'Se actualiza un producto existente usando su ID.',DELETE:'Se elimina el registro identificado por su ID.'}[activeMethod]}</p></div></div>`, `<p><b>Qué decir:</b> “CRUD describe lo que hacemos con los registros; GET, POST, PUT y DELETE son métodos HTTP que utiliza nuestra API”.</p><p><b>Interacción:</b> pulsa cada tarjeta y pide al grupo que nombre el equivalente SQL. No confundas <b>PUT</b> con PATCH: nuestro proyecto utiliza PUT.</p>`, '5 min');
add(1,'Paso 1 · Encender XAMPP','MySQL debe funcionar antes de conectarnos con Node.js.',()=>`<div class="columns revratio"><div class="tile">${img(ASSETS.xampp,'Captura real de XAMPP con Apache y MySQL activos','Captura de la preparación realizada: Apache y MySQL en funcionamiento.')}</div><div class="tile"><div class="micro">En el equipo</div><h3>Lista rápida de verificación</h3>${checklist('xampp','Abrir XAMPP Control Panel.')}${checklist('apache','Iniciar Apache para utilizar phpMyAdmin.')}${checklist('mysql','Iniciar MySQL/MariaDB (habitualmente puerto 3306).')}${call('⚠️','Si MySQL falla, revisa si otro servicio ocupa el puerto 3306. No borres la carpeta <code>data</code>.','warning')}</div></div>`, `<p><b>Instrucciones:</b> pide que abran XAMPP y comprueben el estado. En tus capturas, ambos servicios ya aparecían activos.</p><p><b>Detalle técnico:</b> el frontend de Node se sirve en el puerto 3000. Apache sirve aquí principalmente para phpMyAdmin; no ejecuta nuestra API.</p>`, '10 min');
add(1,'Paso 2 · Crear e importar MySQL','Usaremos el archivo exacto del proyecto: base_de_datos.sql.',()=>`<div class="columns"><div class="tile"><div class="micro">phpMyAdmin</div><ol style="color:#dce8f7;font-size:18px;line-height:1.7;padding-left:25px;margin:6px 0"><li>Entrar a <b>localhost/phpmyadmin</b>.</li><li>En la página principal, abrir <b>Importar</b>.</li><li>Seleccionar <b>base_de_datos.sql</b>.</li><li>Presionar <b>Importar</b>.</li><li>Explorar <b>proyecto_web → productos</b>.</li></ol>${call('✓','Este archivo ya incluye <b>CREATE DATABASE</b> y <b>USE proyecto_web</b>. No hace falta crear manualmente la base antes de importar.')}</div><div class="tile">${cod(String.raw`CREATE DATABASE IF NOT EXISTS proyecto_web
  CHARACTER SET utf8mb4
  COLLATE utf8mb4_unicode_ci;

USE proyecto_web;`,'sql','Fragmento del archivo real')}<p class="muted">Estos comandos crean y seleccionan la base de datos.</p><a href="http://localhost/phpmyadmin" target="_blank" rel="noopener" class="secondary" style="display:inline-block;margin-top:7px;text-decoration:none">Abrir phpMyAdmin ↗</a></div></div>`, `<p><b>Demuestra en vivo:</b> selecciona Importar desde la página principal, pues el SQL contiene tanto CREATE DATABASE como USE.</p><p><b>Aviso:</b> el archivo tiene un INSERT de tres productos. Si importan repetidamente, se duplicarán esos registros. Una sola importación basta.</p>`, '12 min');
add(1,'La tabla que vamos a consultar','Una base de datos no es una hoja suelta: tiene estructura y tipos.',()=>`<div class="columns revratio"><div class="tile">${img(ASSETS.mysql,'Captura real de phpMyAdmin con tres productos','Captura real: Cuaderno, Lapiz y Borrador importados en la tabla productos.')}</div><div class="tile"><h3>productos</h3><table class="mini-table"><thead><tr><th>Columna</th><th>Tipo</th><th>Función</th></tr></thead><tbody><tr><td>id</td><td>INT</td><td>Identificador</td></tr><tr><td>nombre</td><td>VARCHAR(100)</td><td>Texto</td></tr><tr><td>precio</td><td>DECIMAL(10,2)</td><td>Dinero</td></tr><tr><td>stock</td><td>INT</td><td>Unidades</td></tr></tbody></table><div class="nextline"><span class="chip green">PRIMARY KEY (id)</span><span class="chip">AUTO_INCREMENT</span></div></div></div>`, `<p><b>Pregunta:</b> “¿Por qué el id no debería repetirse?”. Explica qué es una clave primaria.</p><p><b>Nota:</b> en la captura el nombre aparece como “Lapiz” sin tilde; corresponde al dato exacto insertado por el SQL original.</p>`, '8 min');
add(1,'El SQL que alimenta nuestra aplicación','Crear tabla, insertar y consultar.',()=>`<div class="columns ratio"><div class="tile">${cod(String.raw`CREATE TABLE IF NOT EXISTS productos (
  id INT UNSIGNED NOT NULL AUTO_INCREMENT,
  nombre VARCHAR(100) NOT NULL,
  precio DECIMAL(10,2) NOT NULL,
  stock INT UNSIGNED NOT NULL DEFAULT 0,
  PRIMARY KEY (id)
);

INSERT INTO productos (nombre, precio, stock)
VALUES ('Cuaderno',4500,15),
       ('Lapiz',1200,30),
       ('Borrador',1000,20);

SELECT * FROM productos;`,'sql','base_de_datos.sql · contenido esencial')}</div><div class="tile glow"><div class="micro">Actividad relámpago</div><h3>¿Qué hace SELECT?</h3><p>Antes de consultar la API, observa los registros directamente en MySQL.</p><div class="prompt">¿Cuántos productos hay? ¿Cuánto cuesta un lápiz? ¿Qué indica el stock?</div><div class="nextline"><span class="chip green">Respuesta: 3 registros</span></div></div></div>`, `<p><b>Explicación:</b> CREATE TABLE define estructura; INSERT agrega registros; SELECT permite leerlos.</p><p><b>Control de tiempo:</b> si van retrasados, usa el SQL ya importado y no obligues a todos a escribirlo desde cero.</p>`, '10 min');
add(1,'Paso 3 · Verificar Node y las dependencias','Abrimos la carpeta del proyecto en Visual Studio Code.',()=>`<div class="columns"><div class="tile">${cod('node -v\nnpm -v\nnpm install','bash','Terminal de VS Code')}<div class="tag-list"><span class="chip green">Node detectado</span><span class="chip">npm disponible</span><span class="chip">node_modules creado</span></div><p class="muted">En la preparación real, Node y npm funcionaron y se instalaron correctamente las dependencias.</p></div><div class="tile">${img(ASSETS.npm,'Captura de npm install ejecutado correctamente','Comprobación real de la instalación de paquetes en la carpeta del proyecto.')}</div></div>`, `<p><b>Haz esto:</b> abre la carpeta en VS Code. Comprueba que estén server.js, package.json, public y base_de_datos.sql. Ejecuta npm install.</p><p><b>Si falla la instalación:</b> verifica si Node está instalado y si la máquina tiene acceso al registro de npm o al paquete previamente descargado.</p>`, '8 min');
add(2,'Paso 4 · El archivo .env','Las credenciales de conexión no se escriben en el formulario del navegador.',()=>`<div class="columns ratio"><div class="tile glow"><div class="micro">Configuración local</div>${cod('DB_HOST=127.0.0.1\nDB_PORT=3306\nDB_USER=root\nDB_PASSWORD=\nDB_NAME=proyecto_web\nPORT=3000','env','.env · ejemplo para XAMPP local')}<p class="small muted">Solo si el usuario root local no tiene contraseña; en otros equipos el valor puede ser diferente.</p></div><div class="tile"><h3>¿Por qué separar esta configuración?</h3><p>El archivo <b>.env</b> define a qué servidor, puerto y base de datos nos conectamos.</p>${call('🔐','No compartir contraseñas reales ni subir el archivo <code>.env</code> a repositorios públicos.','warning')}<p style="margin-top:15px">El proyecto lee estas variables mediante <b>dotenv</b>.</p></div></div>`, `<p><b>En la preparación:</b> usaste 127.0.0.1, puerto 3306, root, contraseña vacía y la base proyecto_web. Es la configuración local que ya funcionó.</p><p><b>Aclara:</b> no es una práctica segura para producción usar root sin contraseña; aquí es solo un entorno de desarrollo local.</p>`, '7 min');
add(2,'Paso 5 · Conectar Node a MySQL','mysql2 crea un pool de conexiones para nuestras consultas.',()=>`<div class="columns revratio"><div class="tile">${cod(String.raw`require('dotenv').config();
const express = require('express');
const mysql = require('mysql2/promise');

const db = mysql.createPool({
  host: process.env.DB_HOST || '127.0.0.1',
  port: Number(process.env.DB_PORT || 3306),
  user: process.env.DB_USER || 'root',
  password: process.env.DB_PASSWORD || '',
  database: process.env.DB_NAME || 'proyecto_web',
  waitForConnections: true,
  connectionLimit: 5
});`,'javascript','server.js · conexión real')}</div><div class="tile"><div class="bigicon">▤ ↔ ⬡</div><h3>El backend habla SQL</h3><p><b>mysql2/promise</b> permite ejecutar consultas usando <code>async/await</code>.</p><div class="prompt">El navegador <b>no recibe</b> la contraseña ni se conecta directamente a MySQL.</div><div class="nextline"><span class="chip">API en :3000</span><span class="chip green">MySQL en :3306</span></div></div></div>`, `<p><b>Pregunta:</b> “¿Cuál es el papel de mysql2?”. Respuesta: es el módulo que conecta Node con el motor MySQL/MariaDB.</p><p><b>Conexiones:</b> un pool reutiliza conexiones. No tienes que explicar su implementación interna en profundidad.</p>`, '8 min');
add(2,'Paso 6 · Encender la API','Si el servidor se inicia, podremos consultar rutas desde el navegador.',()=>`<div class="columns"><div class="tile">${cod('npm start','bash','Ejecutar servidor')}<div class="terminal-output" style="min-height:110px">Aplicación: http://localhost:3000\nAPI: http://localhost:3000/api/productos\nMySQL/MariaDB: conexión correcta</div><p class="small muted">Mensajes esperados del proyecto al conectarse correctamente.</p></div><div class="tile glow"><h3>Dos pruebas iniciales</h3><div class="qa-card"><h4>1 · Verificar la conexión</h4><p><a href="http://localhost:3000/api/estado" target="_blank" rel="noopener">localhost:3000/api/estado ↗</a></p><code>{"api":"activa","base_de_datos":"conectada"}</code></div><div class="qa-card"><h4>2 · Consultar productos</h4><p><a href="http://localhost:3000/api/productos" target="_blank" rel="noopener">localhost:3000/api/productos ↗</a></p><p class="small">Debe devolver un arreglo JSON con los productos.</p></div></div></div>`, `<p><b>Demostración:</b> abre la terminal, ejecuta npm start y visita primero /api/estado, después /api/productos.</p><p><b>Advertencia:</b> si abre la página web pero los productos no cargan, eso no demuestra que MySQL esté conectado. La ruta /api/estado sí consulta la base.</p>`, '10 min');
add(2,'READ · Consultar productos','El GET de nuestra API ejecuta una sentencia SELECT.',()=>`<div class="columns revratio"><div class="tile">${cod(String.raw`app.get('/api/productos', manejar(async (req, res) => {
  const [productos] = await db.query(
    'SELECT id, nombre, precio, stock FROM productos ORDER BY id DESC'
  );
  res.json(productos);
}));`,'javascript','server.js · GET real')}<div class="prompt">GET <b>/api/productos</b> → SELECT → respuesta JSON</div></div><div class="tile"><div class="micro">Respuesta de ejemplo</div>${cod(JSON.stringify([...originalProducts].reverse(),null,2),'json','JSON · ejemplo con tres productos')}<a class="secondary" href="http://localhost:3000/api/productos" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;margin-top:6px">Abrir respuesta real ↗</a></div></div>`, `<p><b>Qué explicar:</b> app.get crea una ruta; db.query ejecuta SELECT; res.json devuelve los registros.</p><p><b>Micro-reto:</b> “¿Qué sucede si cambiamos ORDER BY id DESC por ASC?”. Pueden modificar y reiniciar para comprobar el orden.</p>`, '10 min');
add(2,'CREATE · Registrar productos','POST recibe datos y ejecuta INSERT.',()=>`<div class="columns"><div class="tile">${cod(String.raw`app.post('/api/productos', manejar(async (req, res) => {
  const datos = validarProducto(req.body);
  if (datos.error) return res.status(400).json({ error: datos.error });

  const [resultado] = await db.execute(
    'INSERT INTO productos (nombre, precio, stock) VALUES (?, ?, ?)',
    [datos.nombre, datos.precio, datos.stock]
  );
  res.status(201).json({ id: resultado.insertId, ...datos });
}));`,'javascript','server.js · POST real')}</div><div class="tile glow"><span class="method post">POST</span><h3 style="margin-top:13px">Producto de prueba</h3><table class="mini-table"><tbody><tr><td>Nombre</td><td>Marcador</td></tr><tr><td>Precio</td><td>3500</td></tr><tr><td>Stock</td><td>10</td></tr></tbody></table><p style="margin-top:17px">La API devuelve <b>HTTP 201</b> al crear el registro.</p>${call('✓','Los signos <code>?</code> permiten pasar valores mediante una consulta parametrizada.')}</div></div>`, `<p><b>Demostración en vivo:</b> registra “Marcador”, 3500, stock 10. Después abre phpMyAdmin y muestra el registro guardado.</p><p><b>Conceptos:</b> req.body son los datos recibidos; validarProducto comprueba que sean válidos; el código 201 significa recurso creado.</p>`, '10 min');
add(2,'UPDATE y DELETE · Modificar o quitar','Ambas operaciones identifican el producto por su ID.',()=>`<div class="columns"><div class="tile"><span class="method put">PUT</span><h3 style="margin-top:13px">Actualizar</h3>${cod(String.raw`const [resultado] = await db.execute(
  'UPDATE productos SET nombre = ?, precio = ?, stock = ? WHERE id = ?',
  [datos.nombre, datos.precio, datos.stock, id]
);`,'javascript','server.js · consulta UPDATE')}<p>Cambia el precio del marcador de <b>3500 a 4000</b>.</p></div><div class="tile"><span class="method delete">DELETE</span><h3 style="margin-top:13px">Eliminar</h3>${cod(String.raw`const [resultado] = await db.execute(
  'DELETE FROM productos WHERE id = ?', [id]
);`,'javascript','server.js · consulta DELETE')}<p>Después de comprobar el cambio, elimina el marcador de prueba.</p></div></div><div class="nextline">${call('⚠️','<b>WHERE id = ?</b> importa: sin un filtro correcto, una consulta podría afectar varios registros.','warning')}</div>`, `<p><b>Actividad:</b> los estudiantes actualizan un producto y verifican en MySQL; luego eliminan un producto de prueba.</p><p><b>Punto de cuidado:</b> ambas rutas revisan si el producto existe; si no, pueden responder 404. Aclara que 404 significa recurso no encontrado.</p>`, '14 min');
add(3,'¿Cómo llega el formulario a la API?','Con fetch(), el frontend envía una petición HTTP.',()=>`<div class="columns revratio"><div class="tile">${cod(String.raw`const producto = { nombre: 'Marcador', precio: 3500, stock: 10 };

const respuesta = await fetch('/api/productos', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(producto)
});

const datos = await respuesta.json();`,'javascript','Ejemplo didáctico basado en public/app.js')}<div class="prompt">JavaScript <b>envía</b> JSON → API lo procesa → MySQL guarda → vuelve JSON.</div></div><div class="tile"><h3>Observa una petición real</h3><ol style="padding-left:22px;line-height:1.7;color:#d8e5f4"><li>Abre <b>localhost:3000</b>.</li><li>Presiona <b>F12</b> en el navegador.</li><li>Entra en la pestaña <b>Red / Network</b>.</li><li>Registra un producto.</li><li>Selecciona la petición a <b>/api/productos</b>.</li><li>Revisa el método, el JSON y la respuesta.</li></ol><span class="chip green">La evidencia está en Network</span></div></div>`, `<p><b>Importante:</b> este fragmento es una versión breve para la exposición. En public/app.js real, la función pedirAPI gestiona fetch, convierte JSON y comprueba los errores.</p><p><b>Demostración:</b> si no hay pantalla, deja a cada pareja observar Network en su propio navegador.</p>`, '10 min');
add(3,'Laboratorio interactivo · simula la API','Este ejemplo funciona sin servidor: no modifica tu MySQL real.',()=>`<div class="columns revratio"><div class="tile"><div class="pillrow"><span class="chip green">SIMULACIÓN LOCAL</span><span class="small muted">Haz clic en una fila para seleccionar su ID.</span></div><div class="demo-form"><div class="field"><label for="simName">Nombre</label><input id="simName" value="Marcador" autocomplete="off"></div><div class="field"><label for="simPrice">Precio</label><input id="simPrice" type="number" min="0" step="0.01" value="3500"></div><div class="field"><label for="simStock">Stock</label><input id="simStock" type="number" min="0" step="1" value="10"></div></div><div class="action-row"><button class="secondary" data-sim="GET">GET</button><button class="primary" data-sim="POST">POST · Crear</button><button class="secondary" data-sim="PUT">PUT · Editar</button><button class="secondary" data-sim="DELETE">DELETE · Borrar</button><button class="secondary" data-sim="RESET">Reiniciar</button></div><div style="margin:14px 0 7px" class="micro">Datos de demostración · ID seleccionado: <b id="selectedLabel">1</b></div><div class="mini-list" id="simProducts"></div></div><div class="tile"><div class="pillrow" style="justify-content:space-between"><h3 style="margin:0">Petición y respuesta</h3><span class="status">Simulador activo</span></div><div class="terminal-output" id="simOutput" style="margin-top:13px;max-height:320px;overflow:auto"></div><div class="callout" style="margin-top:13px">🧪 <span>Es un <b>modelo de aula</b>. Para probar la base real, utiliza la aplicación en <b>localhost:3000</b>.</span></div></div></div>`, `<p><b>Uso:</b> pide voluntarios que elijan el método. El botón GET consulta el arreglo simulado, POST agrega, PUT modifica el ID seleccionado y DELETE lo elimina.</p><p><b>Explícalo claramente:</b> el simulador no se conecta al proyecto real. Después de la dinámica abre localhost:3000 para verificar las mismas acciones con MySQL.</p>`, '12 min');
add(3,'Tu turno · demostrar las cuatro operaciones','La actividad ya debe funcionar en cada equipo.',()=>`<div class="columns ratio"><div class="tile glow"><div class="micro">Checklist de práctica</div>${checklist('crud1','Abro la aplicación en localhost:3000.')}${checklist('crud2','Creo un producto nuevo y aparece en la tabla.')}${checklist('crud3','Edito su precio o stock.')}${checklist('crud4','Elimino el producto de prueba.')}${checklist('crud5','Verifico el resultado en phpMyAdmin.')}</div><div class="tile"><h3>¿Cómo demostrar que es real?</h3><p>Al modificar desde el navegador, abre phpMyAdmin y consulta la tabla <b>productos</b>.</p><div class="prompt">La interfaz cambia <b>porque MySQL cambia</b>; no porque hayamos escrito una fila fija en HTML.</div><div class="nextline"><a class="secondary" href="http://localhost:3000" target="_blank" rel="noopener" style="text-decoration:none">Abrir CRUD real ↗</a></div></div></div>`, `<p><b>Pausa de aula:</b> da entre 15 y 20 minutos para que cada pareja pruebe el CRUD. Circula por los puestos. La evidencia mínima son las cuatro operaciones y la tabla en MySQL.</p><p><b>Si la mitad del grupo se atrasa:</b> detén la exposición y acompaña la configuración antes de continuar.</p>`, '20 min');
add(4,'Exportar la base de datos','El paso que permite llevarse los datos y restaurarlos después.',()=>`<div class="tile"><div class="micro">Secuencia interactiva · pulsa “Siguiente paso”</div><div class="export-visual">${[['1','Elegir base','proyecto_web'],['2','Exportar','Método rápido'],['3','Formato','SQL'],['4','Descargar','proyecto_web.sql']].map(([n,t,s],i)=>`<div class="export-step ${i===exportStep?'active':''}"><span class="step-no">${n}</span><strong>${t}</strong><small>${s}</small></div>`).join('')}</div><div class="columns ratio" style="margin-top:17px"><div class="tile glow"><h3 id="exportTitle">${['Seleccionar la base','Abrir Exportar','Mantener formato SQL','Descargar el archivo'][exportStep]}</h3><p id="exportDesc">${['Entra en phpMyAdmin y haz clic sobre proyecto_web en el panel izquierdo.','En las pestañas de esa base, elige Exportar y usa el método Rápido.','Comprueba que el formato seleccionado sea SQL.','Pulsa Exportar; guarda el archivo .sql generado.'][exportStep]}</p><div class="nextline"><button class="primary" data-export="next">${exportStep===3?'Volver al inicio ↺':'Siguiente paso →'}</button></div></div><div class="tile"><h3>¿Qué contiene el respaldo?</h3><p>Normalmente incluye instrucciones para recrear <b>tablas</b> y recuperar sus <b>registros</b>.</p>${call('💾','El archivo <b>.sql</b> contiene los datos exportados; no reemplaza a los archivos del proyecto Node.js.')}</div></div></div>`, `<p><b>Demostración en vivo:</b> phpMyAdmin → proyecto_web → Exportar → Rápido → SQL → Exportar. Los estudiantes deben obtener un archivo descargado.</p><p><b>Precisión:</b> la presentación enseña el procedimiento. El botón Siguiente paso no exporta MySQL; para hacerlo deben usar phpMyAdmin.</p>`, '12 min');
add(4,'Importar el respaldo sin romper el proyecto','Primero probamos en una base diferente.',()=>`<div class="columns ratio"><div class="tile warning"><div class="micro">Nunca borrar proyecto_web para probar</div><h3>Restauración segura</h3><ol style="padding-left:22px;line-height:1.65;color:#f7e6cf"><li>En phpMyAdmin crea <b>proyecto_web_respaldo</b>.</li><li>Abre el archivo exportado en VS Code.</li><li>Si contiene <b>CREATE DATABASE</b> o <b>USE proyecto_web</b>, ajústalo para el nombre del respaldo.</li><li>Selecciona <b>proyecto_web_respaldo</b>.</li><li>Importa el SQL ajustado.</li><li>Comprueba tablas y registros.</li></ol></div><div class="tile"><div class="bigicon">▤ → ▤</div><h3>¿Por qué revisamos el SQL?</h3><p>Porque algunas exportaciones pueden indicar explícitamente en qué base importar los datos.</p>${call('⚠️','Si el SQL contiene <code>USE proyecto_web;</code>, podría dirigir la importación a la base original. Revísalo antes de probar.','warning')}<p style="margin-top:17px" class="muted">La aplicación Node sigue conectada a la base original, mientras el respaldo permite verificar que los datos se recuperan.</p></div></div>`, `<p><b>Enfatiza:</b> no borren la base original solo para mostrar que saben importar. Usen una base separada y comprueben si el SQL incluye instrucciones de nombre de base.</p><p><b>Evaluación:</b> que expliquen la diferencia entre “copiar el código fuente” y “respaldar los datos”.</p>`, '11 min');
add(4,'Si algo falla, sabemos dónde mirar','No improvises: identifica la capa donde está el problema.',()=>`<div class="columns"><div class="tile"><details class="accordion"><summary>MySQL no inicia en XAMPP</summary><p>Comprueba si el puerto 3306 está ocupado. En Windows, <code>netstat -ano | findstr :3306</code>. Identifica el servicio antes de detenerlo. No borres archivos de datos.</p></details><details class="accordion"><summary>ER_BAD_DB_ERROR</summary><p>La base indicada en <code>DB_NAME</code> no existe. Comprueba que importaste <code>base_de_datos.sql</code> y usas <code>proyecto_web</code>.</p></details><details class="accordion"><summary>ER_ACCESS_DENIED_ERROR</summary><p>Revisa <code>DB_USER</code> y <code>DB_PASSWORD</code> en el archivo <code>.env</code>.</p></details></div><div class="tile"><details class="accordion"><summary>ECONNREFUSED o no hay conexión</summary><p>Revisa que MySQL esté activo y que el puerto y host del archivo .env correspondan al servidor real.</p></details><details class="accordion"><summary>La página abre, pero no aparecen productos</summary><p>Prueba <code>/api/estado</code>, luego <code>/api/productos</code> y observa el error en la terminal de Node.</p></details><details class="accordion"><summary>El puerto 3000 está ocupado</summary><p>Cierra el otro servidor local que esté usando 3000 o cambia PORT en .env y reinicia Node.</p></details></div></div><div class="nextline">${call('🧭','Regla útil: primero verifica XAMPP/MySQL; después la conexión de Node; finalmente el frontend.')}</div>`, `<p><b>Guion:</b> “Cuando algo falla, primero identifiquemos en qué parte del recorrido está: base de datos, API o navegador”.</p><p><b>Avisa:</b> usar Workbench no significa que sea el servidor; revisa el servicio MySQL instalado si el puerto está ocupado.</p>`, '10 min');
add(5,'Reto final por equipos','No basta con que el proyecto abra: deben demostrar lo que hace.',()=>`<div class="columns ratio"><div class="tile glow"><div class="micro">Entrega mínima</div>${checklist('final1','API conectada y GET respondiendo con JSON.')}${checklist('final2','POST registra un producto y se ve en MySQL.')}${checklist('final3','PUT modifica un producto existente.')}${checklist('final4','DELETE elimina el producto de prueba.')}${checklist('final5','Archivo SQL exportado y proyecto listo para compartir.')}</div><div class="tile"><h3>¿Terminaron antes?</h3><p><b>Reto adicional:</b> agregar la columna <code>categoria</code> y adaptar el formulario, la validación y las consultas de la API.</p><div class="divider"></div><h4>Distribución sugerida</h4><table class="mini-table"><tbody><tr><td>Conexión + datos</td><td>2 puntos</td></tr><tr><td>Crear + consultar</td><td>3 puntos</td></tr><tr><td>Editar + eliminar</td><td>3 puntos</td></tr><tr><td>Explicar el flujo</td><td>2 puntos</td></tr></tbody></table><p class="small muted" style="margin-top:10px">Rúbrica sugerida; adáptala a las indicaciones del docente titular.</p></div></div>`, `<p><b>Entrega:</b> proyecto fuente más SQL. Excluir node_modules y el .env con contraseñas. Si el reto es demasiado avanzado, basta con demostrar el CRUD funcionando.</p><p><b>Para mantener el ritmo:</b> organiza por parejas; que cada pareja muestre una operación y explique a qué ruta y consulta corresponde.</p>`, '17 min');
add(5,'Comprobemos lo aprendido','Haz clic en una respuesta y permite que el grupo justifique.',()=>`<div class="columns three"><div class="tile"><div class="micro">Pregunta 1</div><h3>¿Quién consulta MySQL?</h3><div class="quiz-options"><button class="quiz-btn ${quizAnswers.q1==='a'?'bad':''}" data-quiz="q1" data-answer="a">A. El navegador directo</button><button class="quiz-btn ${quizAnswers.q1==='b'?'good':''}" data-quiz="q1" data-answer="b">B. Node.js mediante mysql2</button></div><div class="quiz-feedback ${quizAnswers.q1==='a'?'bad':''}">${quizAnswers.q1?(quizAnswers.q1==='b'?'✓ Correcto. El backend consulta MySQL.':'Intenta otra vez: revisa el flujo de datos.'):'Elige una opción.'}</div></div><div class="tile"><div class="micro">Pregunta 2</div><h3>¿Qué método crea?</h3><div class="quiz-options"><button class="quiz-btn ${quizAnswers.q2==='a'?'good':''}" data-quiz="q2" data-answer="a">A. POST</button><button class="quiz-btn ${quizAnswers.q2==='b'?'bad':''}" data-quiz="q2" data-answer="b">B. GET</button></div><div class="quiz-feedback ${quizAnswers.q2==='b'?'bad':''}">${quizAnswers.q2?(quizAnswers.q2==='a'?'✓ POST envía los datos del nuevo producto.':'GET consulta; no crea.'):'Elige una opción.'}</div></div><div class="tile"><div class="micro">Pregunta 3</div><h3>¿Qué respaldamos con SQL?</h3><div class="quiz-options"><button class="quiz-btn ${quizAnswers.q3==='a'?'bad':''}" data-quiz="q3" data-answer="a">A. Todo Node.js</button><button class="quiz-btn ${quizAnswers.q3==='b'?'good':''}" data-quiz="q3" data-answer="b">B. Tablas y datos</button></div><div class="quiz-feedback ${quizAnswers.q3==='a'?'bad':''}">${quizAnswers.q3?(quizAnswers.q3==='b'?'✓ El SQL exportado respalda la base.':'El código y la base se entregan por separado.'):'Elige una opción.'}</div></div></div>`, `<p><b>Dinámica:</b> un estudiante responde y otro justifica. No avances hasta que puedan explicar que la API intermedia entre la interfaz y MySQL.</p><p><b>Consejo:</b> no memorizar métodos sin saber demostrar sus efectos reales.</p>`, '5 min');
add(5,'¡CRUD completado!','Una aplicación pequeña, un recorrido técnico completo.',()=>`<div class="hero-grid"><div><div class="eyebrow">Cierre de la clase</div><h1 class="title">Del <span class="accent">clic</span> al <span class="blue">dato</span>.</h1><p class="subtitle">Frontend → API REST → MySQL → respuesta JSON. Conectamos las piezas, probamos las operaciones y aprendimos a respaldar la información.</p><div class="tag-list"><span class="chip green">✓ Crear</span><span class="chip green">✓ Leer</span><span class="chip green">✓ Actualizar</span><span class="chip green">✓ Eliminar</span><span class="chip green">✓ Exportar SQL</span></div><div class="nextline"><button class="primary" data-go="0">Volver al inicio ↺</button><button class="secondary" data-action="toggleNotes">Ver cierre docente</button></div></div><div class="tile glow" style="align-self:center"><div class="micro">Recordatorio rápido</div>${cod('npm install\nnpm start\n\nhttp://localhost:3000\nhttp://localhost:3000/api/estado\nhttp://localhost:3000/api/productos','bash','Comandos y direcciones')}<p class="small muted">Con MySQL activo y la base proyecto_web previamente importada.</p></div></div>`, `<p><b>Cierre sugerido:</b> “Hoy vieron que una página web puede guardar información persistentemente. El usuario interactúa con una interfaz; Node procesa las peticiones y MySQL guarda los datos. Exportar el SQL permite respaldarlos”.</p><p><b>Último minuto:</b> comprueba las entregas, agradece la participación y deja clara la evidencia que deben compartir con el docente titular.</p>`, '4 min');

const stage=document.querySelector('#stage'), outline=document.querySelector('#outline'),notesPanel=document.querySelector('#notes'),toast=document.querySelector('#toast');
function render(){const s=slides[current];stage.innerHTML=`<article class="slide ${s.special==='cover'?'cover':''}">${s.special==='cover'?s.content():`<header class="hgroup"><p class="eyebrow">${esc(phases[s.phase])} · ${String(current+1).padStart(2,'0')}</p><h1 class="title">${s.title}</h1><p class="subtitle">${s.subtitle}</p></header>${s.content()}`}</article>`;stage.scrollTop=0;document.querySelector('#phasePill').textContent=phases[s.phase];document.querySelector('#slideMeta').textContent=`${String(current+1).padStart(2,'0')} / ${slides.length}`;document.querySelector('#counter').textContent=`${String(current+1).padStart(2,'0')} / ${slides.length}`;document.querySelector('#progress').style.width=`${(current+1)/slides.length*100}%`;document.querySelector('#prevBtn').disabled=current===0;document.querySelector('#nextBtn').disabled=current===slides.length-1;document.querySelector('#notesInner').innerHTML=s.notes;document.querySelector('#timeNote').textContent=s.time;outline.classList.toggle('show',showOutline);notesPanel.classList.toggle('show',showNotes);document.querySelector('#notesBtn').classList.toggle('active',showNotes);document.querySelector('#outlineBtn').classList.toggle('active',showOutline);document.querySelector('#fontBtn').classList.toggle('active',largeText);document.body.classList.toggle('large-text',largeText);buildOutline();if(document.querySelector('#simProducts'))renderSimulator();}
function buildOutline(){const list=document.querySelector('#outlineList');let result='',last=-1;slides.forEach((s,i)=>{if(last!==s.phase){result+=`<p class="micro" style="margin:17px 8px 7px">${esc(phases[s.phase])}</p>`;last=s.phase}result+=`<button class="outline-item ${i===current?'current':''}" data-go="${i}"><span>${String(i+1).padStart(2,'0')}</span>${esc(s.title)}</button>`});list.innerHTML=result}
function go(i){current=Math.max(0,Math.min(slides.length-1,Number(i)));showOutline=false;render()}
function noteToggle(){showNotes=!showNotes;render()}
function outToggle(){showOutline=!showOutline;render()}
function notify(message){toast.textContent=message;toast.style.display='block';setTimeout(()=>{toast.style.display='none'},1700)}
async function copyText(value){try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(value)}else{const ta=document.createElement('textarea');ta.value=value;ta.style.position='fixed';ta.style.left='-9999px';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('No se pudo copiar')}notify('Código copiado')}catch(e){notify('Selecciona el código y cópialo manualmente')}}
function renderSimulator(){let element=document.querySelector('#simProducts');if(!element)return;element.innerHTML=products.length?products.map(p=>`<div class="${selectedId===p.id?'selected':''}" data-selectid="${p.id}"><span class="id">#${p.id}</span><span>${esc(p.nombre)}</span><span class="price">$${p.precio.toLocaleString('es-CO')}</span><span style="text-align:right">${p.stock} u.</span></div>`).join(''):'<div style="display:block">No quedan productos en esta simulación.</div>';document.querySelector('#simOutput').textContent=simOutput;document.querySelector('#selectedLabel').textContent=selectedId??'ninguno'}
function sim(method){if(method==='RESET'){products=JSON.parse(JSON.stringify(originalProducts));nextId=4;selectedId=1;simOutput='Simulación reiniciada. No se modificó MySQL real.';renderSimulator();return}const vals=()=>({nombre:document.querySelector('#simName').value.trim(),precio:Number(document.querySelector('#simPrice').value),stock:Number(document.querySelector('#simStock').value)});if(method==='GET'){simOutput='GET /api/productos\nHTTP 200 OK\n'+JSON.stringify([...products].sort((a,b)=>b.id-a.id),null,2)}else if(method==='POST'||method==='PUT'){const v=vals();if(v.nombre.length<2||!Number.isFinite(v.precio)||v.precio<0||!Number.isSafeInteger(v.stock)||v.stock<0){simOutput='HTTP 400 Bad Request\n{"error":"Revisa nombre, precio y stock"}';renderSimulator();return}if(method==='POST'){let p={id:nextId++,...v};products.push(p);selectedId=p.id;simOutput='POST /api/productos\nJSON enviado: '+JSON.stringify(v)+'\nHTTP 201 Created\n'+JSON.stringify(p,null,2)}else{let p=products.find(p=>p.id===selectedId);if(!p){simOutput='PUT /api/productos/:id\nHTTP 404 Not Found';renderSimulator();return}Object.assign(p,v);simOutput='PUT /api/productos/'+p.id+'\nJSON enviado: '+JSON.stringify(v)+'\nHTTP 200 OK\n'+JSON.stringify(p,null,2)}}else if(method==='DELETE'){const p=products.find(p=>p.id===selectedId);if(!p){simOutput='DELETE /api/productos/:id\nHTTP 404 Not Found'}else{products=products.filter(x=>x.id!==p.id);simOutput='DELETE /api/productos/'+p.id+'\nHTTP 200 OK\n'+JSON.stringify({mensaje:'Producto eliminado',id:p.id},null,2);selectedId=products[0]?.id??null}}renderSimulator()}
function toggleFull(){if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>notify('Pantalla completa no disponible'))}else document.exitFullscreen?.()}
document.querySelector('#prevBtn').onclick=()=>go(current-1);document.querySelector('#nextBtn').onclick=()=>go(current+1);document.querySelector('#outlineBtn').onclick=outToggle;document.querySelector('#notesBtn').onclick=noteToggle;document.querySelector('#fontBtn').onclick=()=>{largeText=!largeText;render()};document.querySelector('#fullBtn').onclick=toggleFull;document.querySelector('#closeNotes').onclick=noteToggle;
document.addEventListener('click',e=>{const c=e.target.closest('[data-copy]');if(c){copyText(decodeURIComponent(c.dataset.copy));return}const nav=e.target.closest('[data-go]');if(nav){go(nav.dataset.go);return}const met=e.target.closest('[data-method]');if(met){activeMethod=met.dataset.method;render();return}const fl=e.target.closest('[data-flow]');if(fl){flowStep=Number(fl.dataset.flow);render();return}const exp=e.target.closest('[data-export]');if(exp){exportStep=(exportStep+1)%4;render();return}const ans=e.target.closest('[data-quiz]');if(ans){quizAnswers[ans.dataset.quiz]=ans.dataset.answer;render();return}const si=e.target.closest('[data-selectid]');if(si){selectedId=Number(si.dataset.selectid);const selected=products.find(p=>p.id===selectedId);if(selected){document.querySelector('#simName').value=selected.nombre;document.querySelector('#simPrice').value=selected.precio;document.querySelector('#simStock').value=selected.stock}renderSimulator();return}const simbtn=e.target.closest('[data-sim]');if(simbtn){sim(simbtn.dataset.sim);return}if(e.target.closest('[data-action="toggleNotes"]')){noteToggle();return}});
document.addEventListener('change',e=>{const check=e.target.closest('[data-check]');if(check){checkState[check.dataset.check]=check.checked;check.closest('.check-row')?.classList.toggle('done',check.checked)}});
document.addEventListener('keydown',e=>{const el=document.activeElement;const isInput=el&&['INPUT','TEXTAREA','SELECT'].includes(el.tagName);if(isInput)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}else if(e.key.toLowerCase()==='n'){noteToggle()}else if(e.key.toLowerCase()==='g'){outToggle()}else if(e.key.toLowerCase()==='f'){toggleFull()}else if(e.key==='Escape'&&showOutline){showOutline=false;render()}});
render();
</script>
